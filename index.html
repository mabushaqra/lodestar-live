on:"Immutable, versioned logging of system decisions, model versions and configuration changes, retained long enough to reconstruct any decision.",evidenceRequired:"Log retention policy and a sample decision reconstruction",satisfiesObligations:["SA-AUDIT","DIFC-10.3.4"],suggestionStrength:"general",acceptsTestEvidence:!0},{id:"C-09",title:"Customer AI disclosure notices",description:"Standard notices telling customers when AI materially drives a decision or interaction affecting them, embedded at the point of interaction.",evidenceRequired:"Live notice text and placement screenshots",satisfiesObligations:["AE-DISC","EU-ART50"],suggestionStrength:"specific",acceptsTestEvidence:!1},{id:"C-10",title:"Provider-obligation gap analysis for modified models",description:"Where a bought model has been materially modified, a gap analysis of the provider obligations that now attach, with a remediation plan and owner.",evidenceRequired:"Completed gap analysis with remediation plan",satisfiesObligations:["QA-14.3"],suggestionStrength:"specific",acceptsTestEvidence:!1},{id:"C-11",title:"AI incident reporting runbook",description:"A runbook defining what counts as an AI incident, the escalation path, reporting deadlines and the regulators to be notified per jurisdiction.",evidenceRequired:"Published runbook and record of any incident reports filed",satisfiesObligations:["SA-INC","EU-ART73"],suggestionStrength:"general",acceptsTestEvidence:!1},{id:"C-12",title:"High-risk classification and documentation pack",description:"A documentation pack for each system classified high-risk: classification rationale, technical documentation, data governance summary and conformity records.",evidenceRequired:"Documentation pack per high-risk system, version-controlled",satisfiesObligations:["EU-ANNEX3","QA-9.7"],suggestionStrength:"specific",acceptsTestEvidence:!0},{id:"C-13",title:"AI policy alignment review",description:"An annual review confirming the AI policy complements existing risk frameworks, mapping each AI-specific requirement to the framework that owns it.",evidenceRequired:"Review memo with framework mapping table",satisfiesObligations:["AE-8b"],suggestionStrength:"general",acceptsTestEvidence:!1},{id:"C-14",title:"Personal data processing notice",description:"Data-subject notices covering AI processing of personal data: what is processed, why, and the rights available, published wherever data is collected.",evidenceRequired:"Published notice and last legal review date",satisfiesObligations:["DIFC-NOTICE"],suggestionStrength:"specific",acceptsTestEvidence:!1}],mt=e=>ys.find(t=>t.id===e);function mi(e,t){return{filename:e,capturedOn:"2026-07-14T09:00:00.000Z",text:t.trim()}}const _e={"sys-1":{card:mi("procurement-agent-v3-model-card.md",`Model: internal-procurement-agent-v3
Owner: Central Government Procurement (deployer and provider)
Intended use: Rank supplier submissions for government tenders and issue the shortlist that the award committee works from.

The agent reads the published tender pack and every supplier submission, scores each bidder against the weighted criteria in that pack, and writes a ranked shortlist. In production the list can proceed to award without a further mandatory human confirmation. Evaluation cycles that used to take three weeks now close in about four days. Annual throughput is roughly AED 2.1 billion of awarded spend.

Training used awarded and unsuccessful bid packs from 2019–2025 plus the published criteria for each tender class. Known limits: first-time suppliers, joint-venture structures, and any bidder whose track record is thinner than the historical award set. A vendor left off the list has no visibility into the score. The live governance question is the missing human gate, not the scoring formula.`),details:{modelType:"Document-ranking encoder with a weighted scoring head. The encoder reads the tender pack and each supplier submission; the head applies the published criterion weights and returns a ranked shortlist with a per-criterion scorecard.",language:"English and Modern Standard Arabic. Bid packs in either language are accepted; mixed-language annexes are scored, not dropped.",license:"Internal government licence. Weights and scorecards do not leave the procurement authority. No vendor redistribution.",baseModel:"Not a commercial foundation-model finetune. Built in-house on a licensed bilingual encoder that the authority already held for records search. The ranking head and criterion-weighting layer are original to this programme.",fundedBy:"Central procurement modernisation programme, 2024–2026 capital envelope. Recurring inference sits on the government operations budget under the Autonomous Systems Officer’s cost centre.",trainingData:"Awarded and unsuccessful bid packs from calendar years 2019–2025, joined to the published evaluation criteria for each tender class (goods, works, services, and framework call-offs). Personal names of evaluators were stripped. Company identifiers, prices, and scored comments were kept because they are the decision record. First-time suppliers and joint ventures are present but sparse relative to repeat incumbents.",testingData:"A hold-out of 140 tenders from late 2025 that the model never trained on, plus a challenge set of 40 packs built by category managers: first-time suppliers, unincorporated joint ventures, and bidders whose previous work was only as a subcontractor.",testingMetrics:"Spearman rank correlation with the historical award panel on the hold-out; complaint rate from excluded vendors within 90 days of shortlist; share of first-time suppliers appearing in the top five; time from pack upload to issued list.",resultsSummary:"Hold-out rank correlation with historical panels is 0.81. First-time suppliers and joint ventures are systematically ranked lower than the challenge-set reviewers would have placed them. Those packs now carry a warning flag on the scorecard, but the shortlist can still issue without a person confirming the flag. Mean time from upload to issued list is 4.2 hours. Vendor complaint rate on exclusions is 6.8 per 100 lists, concentrated on first-time bidders.",biasRisksLimitations:"Past award data encodes incumbent advantage. A capable new supplier can be left off a shortlist with no explanation to the market. Joint-venture structures are under-represented in the labelled set, so the model treats unfamiliar consortium wording as risk. The decision is not reversible once a tender proceeds to award. Officers can reject a list, but that gate is optional in the production path — that is the disagreement on file with the Autonomous Systems Officer.",biasRecommendations:"Do not treat the ranked list as a completed award. Category managers should reject or reorder a list when the warning flag is on, and that rejection should be the recorded decision. Downstream contract systems must not auto-issue from this ranking. Until a mandatory human confirmation is in place, treat every issued list as an autonomous action of the authority.",hardwareType:"Eight NVIDIA A10G GPUs for training; CPU inference on the government application cluster for live scoring.",hoursUsed:"Eighty GPU-hours for the v3 ranking-head training run in June 2026. Earlier encoder pre-training is not attributed to this card.",cloudProvider:"On-premises government cloud. No public-cloud training or inference.",cloudRegion:"UAE central government zone (ae-central).",co2Emitted:"Estimated 34 kilograms of CO2-equivalent for the v3 training run, using the government cloud’s published grid factor. Live inference is not separately metered.",downstreamUse:"The issued shortlist is the working list for the award committee. Contract-generation and purchase-order systems must take a recorded award decision, not this ranking. Do not reuse scores for vendor debarment or performance ratings.",getStarted:"A category manager uploads the published tender pack and the supplier submissions. The agent returns a ranked shortlist and a per-criterion scorecard. In production, accepting the list without edit is the default path. To reject or reorder, the manager must file a reason; that reason is what the Autonomous Systems Officer reviews.",paperUrl:"https://procurement.gov.example/ai-evaluation/notes/v3-ranking-method.pdf",demoUrl:"https://procurement.gov.example/ai-evaluation/sandbox",citationBibtex:`@techreport{procurement-agent-v3,
  title={internal-procurement-agent-v3 model card},
  author={Al-Marri, S.},
  institution={Central Government Procurement},
  year={2026},
  month={7},
  url={https://procurement.gov.example/ai-evaluation/model-card}
}`,glossary:"Shortlist: the set of vendors invited to the award stage. Issued list: a shortlist that has left the agent and is treated as the committee’s starting order. Acts-alone: there is no mandatory human confirmation before the list is issued. Warning flag: a scorecard mark for first-time suppliers or joint ventures; it does not block issue.",moreInformation:"Version 3 entered production on 12 May 2026. Version 2 required a manager to press confirm; that step was removed after a backlog review and is the subject of the open disagreement on DIFC-ASO. Next scheduled model review is 12 November 2026, or earlier if the complaint rate on first-time suppliers exceeds 10 per 100 lists. Contact the Autonomous Systems Officer for the evaluation protocol.",modelCardAuthors:"S. Al-Marri, Head of Evaluation Systems (deployer and provider), with the Autonomous Systems Officer as reviewing author.",modelCardContact:"procurement-ai@gov.example — copy aso@gov.example for autonomy and liability questions."}},"sys-2":{card:mi("sf-credit-7b-model-card.md",`Model: SF-Credit-7B-finetune
Owner: Retail Credit Risk (deployer). Base weights: ScoreForge Ltd (provider of the purchased model).
Intended use: Estimate probability of default on consumer credit applications at origination, then write a recommendation for a human underwriter.

The book is about 90,000 consumer applications a year in the UAE, including EU residents served from the DIFC entity. Underwriters review every recommendation before a facility is issued. Approval turnaround fell from two days to under four hours after rollout. Because the bank finetuned the vendor base model on its own repayment history, provider-style duties sit with the bank as well as ScoreForge.

Known limits: thin-file applicants and non-resident segments. Those applications are routed to manual review. The score is not used for employment, housing, or insurance.`),details:{modelType:"Supervised credit-risk classifier. A ScoreForge 7B decoder is finetuned to estimate probability of default at origination and to write a short rationale for the underwriter. The production decision is accept, refer, or decline — the underwriter remains accountable for the facility.",language:"English and Arabic application forms. Bureau files arrive in English; free-text employer and address fields may be Arabic.",license:"ScoreForge customer licence for the base weights, plus an internal bank licence for the finetune and the rationale head. Weights do not leave the bank’s model-risk inventory.",baseModel:"ScoreForge SF-7B, customer release 2025.11, finetuned in-house as SF-Credit-7B-finetune.",fundedBy:"Internal retail credit programme. ScoreForge licence and the 2026 finetune sit on the Retail Credit Risk budget; ongoing inference is charged to origination operations.",trainingData:"Licensed bureau files and internal repayment history for UAE consumer facilities originated between 2018 and 2025, including settled, charged-off, and still-open accounts. EU-resident applications booked in the DIFC entity are in the set. Thin-file applicants (fewer than three bureau tradelines) are labelled but under-represented. Protected attributes used in fairness testing are held in a restricted store and are not features in the live score.",testingData:"Hold-out origination vintages from the second half of 2025, a thin-file challenge set of 8,400 applications, and a non-resident challenge set built from DIFC-booked EU residents.",testingMetrics:"Area under the ROC curve, Kolmogorov–Smirnov statistic, demographic parity gap and equalised-odds gap on nationality and sex, share of applications routed to manual review, and time from application to underwriter decision.",resultsSummary:"Hold-out AUC is 0.79 and KS is 0.41. Thin-file AUC falls to 0.68 and non-resident AUC to 0.71; both segments are forced to manual review. The latest fairness run (promptfoo and Giskard, July 2026) showed a demographic-parity gap above the bank’s internal band on nationality. Those findings are on the evidence record and have not been closed. Median time from application to underwriter decision is 3.6 hours.",biasRisksLimitations:"Scores can reflect historical lending patterns, especially on thin-file and non-resident applicants. A decline recommendation is visible to the customer as a longer wait even when an underwriter later approves. The bank modified a vendor model, so it cannot treat ScoreForge as the sole provider. The score is not a credit decision on its own — but underwriters start from it, and a low score is rarely overturned without new evidence.",biasRecommendations:"The named underwriter remains accountable for every facility. Do not use the score as the sole basis for a decline. Do not reuse it for collections strategy, employment screening, or insurance. Thin-file and non-resident applications must stay on the manual-review path until the July 2026 fairness gap is inside the agreed band.",hardwareType:"NVIDIA A10G (four GPUs) for the June 2026 finetune; CPU plus one A10G for live scoring behind the origination API.",hoursUsed:"One hundred and twenty GPU-hours for the production finetune. Fairness reruns after the July test failures used a further 18 GPU-hours.",cloudProvider:"Amazon Web Services, bank-controlled account.",cloudRegion:"me-central-1 (UAE). No training data is copied to EU regions; scoring for EU residents still runs in me-central-1.",co2Emitted:"Estimated 51 kilograms of CO2-equivalent for the production finetune, using AWS published factors for me-central-1. Live inference is not separately reported.",downstreamUse:"The recommendation and rationale are written into the origination file for the underwriter. Do not feed the score into collections, marketing propensity, or employment checks. Customer-facing notices must say that an automated score informed the decision and that a person decided the facility.",getStarted:"An application lands on the origination desk. The model returns a probability of default, an accept / refer / decline recommendation, and a four-line rationale. The underwriter must record a decision before a facility can be issued. Refer and all thin-file or non-resident cases open a mandatory checklist; they cannot be straight-through approved.",paperUrl:"https://scoreforge.example/sf-credit-7b/method-note.pdf",demoUrl:"https://bank.example/credit-ai/underwriter-sandbox",citationBibtex:`@techreport{sf-credit-7b-finetune,
  title={SF-Credit-7B-finetune model card},
  author={{ScoreForge model risk} and Haddad, L.},
  institution={Retail Credit Risk},
  year={2026},
  month={7},
  note={Vendor base SF-7B; bank finetune},
  url={https://scoreforge.example/sf-credit-7b/model-card}
}`,glossary:"Thin-file: an applicant with fewer than three bureau tradelines. Refer: a recommendation that the underwriter must open the checklist before deciding. Facility: the credit product being originated. Provider-style duties: obligations the bank accepted by finetuning a purchased model rather than only deploying it.",moreInformation:"Production since 3 March 2026. The July 2026 fairness tests (bias-fairness category) failed the internal band and are still open on the evidence record. Next model-risk committee is 21 August 2026. Art. 50 transparency wording for EU residents is the subject of an open disagreement — the engine treats the duty as applying; the bank’s position is that a human decision means the notice can wait. Contact model-risk@bank.example.",modelCardAuthors:"ScoreForge model-risk office (base card) and L. Haddad, Retail Credit Risk (finetune, deployment, and this inventory card).",modelCardContact:"model-risk@bank.example — copy governance@lodestar.demo for the open Art. 50 disagreement."}},"sys-3":{card:mi("benefits-screener-v2-model-card.md",`Model: benefits-screener-v2
Owner: Social Protection programme office (provider and deployer)
Intended use: Help a caseworker see whether a household appears eligible for a published social-protection programme. The model does not issue or withhold payments.

The programme covers about 1.2 million beneficiaries. Since rollout, average time-to-decision fell from 19 days to 6, and applications returned for missing documents dropped by about a third. A human caseworker always makes the determination. A wrong recommendation still changes who waits, which is why the system is recorded as recommends, not acts-alone.

Known limits: informal-income households and multi-household addresses. Those files are routed to a named caseworker.`),details:{modelType:"Rules-plus-classifier eligibility aid. Published programme rules are applied first as deterministic checks. A classifier then flags incomplete files and drafts a recommendation that cites the matching clauses for the caseworker.",language:"Arabic is the working language of the case file. English appears on some supporting documents; those pages are read, not discarded.",license:"Internal ministry licence. The classifier and the rule pack do not leave the social-protection programme office.",baseModel:"Not finetuned from a commercial generative model. The rule engine is authored against the published programme circulars. The classifier is trained from labelled ministry case files.",fundedBy:"Social protection digital programme, 2025–2027. Inference and caseworking time sit on the programme operations budget.",trainingData:"Historical case files and the published programme rules in force from 2020 through 2025. Informal-income households are under-represented because those files more often stall before a determination. Multi-household addresses (one national-address record, several families) were labelled in a 2025 cleanup but remain a small share of the training set. Payment outcomes are not in the training labels — only the caseworker’s eligibility determination.",testingData:"Hold-out governorates that the model was not trained on, plus a challenge set of 1,200 files with informal income, shared addresses, or missing identity documents.",testingMetrics:"Agreement with senior caseworker determinations on complete files; recall of missing-document flags; time from filing to determination; share of informal-income files sent back for documents.",resultsSummary:"Agreement with senior reviewers is 0.88 on complete files and 0.71 on informal-income and multi-household cases. Missing-document recall is 0.83. Those weaker files are routed to a named caseworker, which is why autonomy is recorded as recommends. Average time-to-decision is 6 days, down from 19. An incident-reporting disagreement on this system was opened and then resolved — the resolution is that a missed payment still needs a human incident file, not an automated close.",biasRisksLimitations:"A wrong recommendation still shapes who waits 19 days versus 6. Households with informal income or shared addresses are more often sent back for documents, which delays payment even when the caseworker later finds them eligible. The model has never been trained on immigration or criminal records and must not be pointed at those questions.",biasRecommendations:"The caseworker remains accountable for every determination. Do not use the recommendation as the payment decision. Payment systems must take a recorded human determination. Keep informal-income and shared-address files on the named-caseworker path.",hardwareType:"Ministry CPU cluster. No GPU training for v2.",hoursUsed:"About 220 CPU-hours for the v2 classifier refresh in April 2026. Rule-pack edits do not use a training run.",cloudProvider:"National government cloud, ministry tenancy.",cloudRegion:"Saudi central government zone (sa-central).",co2Emitted:"Estimated 9 kilograms of CO2-equivalent for the April 2026 classifier refresh. Live scoring is not separately metered.",downstreamUse:"Draft recommendation and cited clauses only. The payment engine, the appeals desk, and any overpayment recovery must take a human determination. Do not reuse the score for immigration, policing, or credit.",getStarted:"A caseworker opens the application. The aid lists matching rule clauses, missing documents, and a draft recommendation. The caseworker must record a determination before payment can move. Informal-income and shared-address files open with the named-caseworker checklist already on.",paperUrl:"https://spa.gov.example/benefits-screener/notes/v2-rules-and-classifier.pdf",demoUrl:"https://spa.gov.example/benefits-screener/caseworker-sandbox",citationBibtex:`@techreport{benefits-screener-v2,
  title={benefits-screener-v2 model card},
  author={Qassem, R.},
  institution={Social Protection programme office},
  year={2026},
  month={7},
  url={https://spa.gov.example/benefits-screener/card}
}`,glossary:"Determination: the caseworker’s recorded eligibility decision. Recommendation: the model’s draft, which has no payment effect on its own. Informal income: earnings not on a wage file. Named-caseworker path: a file that cannot be closed from the recommendation alone.",moreInformation:"Version 2 in production since 8 February 2026. The SA-INC disagreement on this system is resolved: incident files stay human. Next rule-pack review follows the next published circular, expected Q4 2026. Contact benefits-ai@spa.gov.example.",modelCardAuthors:"R. Qassem, Social Protection (author), with the programme legal desk as reviewing author.",modelCardContact:"benefits-ai@spa.gov.example"}},"sys-4":{card:mi("bayan-gov-13b-model-card.md",`Model: bayan-gov-13b-finetune
Owner: Digital Government Services (deployer). Base weights: Bayan Digital.
Intended use: Answer questions across more than sixty government services on the national portal, and complete routine bookings and status checks without a human in the loop.

The assistant handles about 1.8 million enquiries a year and closes about 70 percent without handoff. Average wait for common questions fell from 11 minutes to seconds. It answers in the government’s name. A confidently wrong fee or deadline is a live complaint.

Known limits: dialectal Arabic, low-literacy phrasing, and any question about fees, deadlines, or eligibility. Those should escalate. The assistant must not complete a payment or an eligibility decision.`),details:{modelType:"Instruction-tuned generative assistant, 13 billion parameters. Bayan 13B is finetuned on published service pages, redacted call-centre transcripts, and a curated FAQ corpus. A retrieval layer pins answers to the current service catalogue. Routine bookings and status checks are completed by tool calls; contested facts must transfer to a human agent with the transcript.",language:"Modern Standard Arabic and English are the supported languages. Gulf dialectal Arabic is accepted but underperforms; those turns should escalate more often than they do today.",license:"Bayan Digital government-deployment licence for the base weights. The finetune and the retrieval index are ministry-controlled and are not returned to the vendor.",baseModel:"Bayan 13B, government release 2025.09, finetuned as bayan-gov-13b-finetune.",fundedBy:"Digital government services programme. Bayan licence and the 2026 finetune sit on the Digital Government Services budget; live inference is charged to the portal operations cost centre.",trainingData:"Published service pages from the national catalogue (refreshed weekly), redacted call-centre transcripts from 2023–2025, and a curated FAQ corpus signed off by each service owner. Live chat logs from the first 90 days of the 2026 pilot were added in v2 after PII redaction. Whether residual sensitive data remains in those logs is still marked unknown on the system record.",testingData:"Held-out service pages from the weekly refresh, a red-team set of 600 fee, deadline and eligibility questions, and a dialectal-Arabic set recorded with call-centre trainers.",testingMetrics:"Grounded-answer rate (reply cites a live catalogue page), escalation precision and recall, dialectal-Arabic comprehension, hallucination rate on fees and deadlines, and share of sessions that close without handoff.",resultsSummary:"About 70 percent of live enquiries close without handoff. Grounded-answer rate is 0.84 on ordinary catalogue questions and 0.61 on fee and deadline questions — those are the cases that become complaints when the model sounds certain. Dialectal Arabic escalates at 0.22 versus 0.41 on the trainer set, so too many dialect turns stay with the model. A hallucination probe on this system is a failed test on the evidence record.",biasRisksLimitations:"The assistant speaks in the government’s name. It can invent a fee, a deadline, or an office that does not exist. Dialectal Arabic and low-literacy phrasing escalate less often than they should. Sensitive-data use in the live logs is still unknown. There is an open disagreement on whether unreviewable autonomy is acceptable for a public assistant that completes transactions.",biasRecommendations:"The banner must state that the user is talking to an AI assistant. Never complete a payment or an eligibility decision in this channel. Escalate when the user contests a fact, names a fee, or asks who is eligible. Do not feed answers into eligibility or enforcement systems.",hardwareType:"NVIDIA A100 (four GPUs) for the v2 finetune; A100 inference pool behind the portal chat.",hoursUsed:"Two hundred and forty GPU-hours for the v2 finetune. Weekly catalogue re-index is CPU-only.",cloudProvider:"National cloud, Digital Government Services tenancy.",cloudRegion:"Saudi central zone (sa-central).",co2Emitted:"Estimated 190 kilograms of CO2-equivalent for the v2 finetune. Live inference is estimated at 12 kilograms per week at current volume; that figure is a catalogue estimate, not a meter.",downstreamUse:"Transcripts can be handed to a human agent. Do not write assistant answers into eligibility, payment, or enforcement systems. Analytics may store redacted transcripts; they must not re-enter training without a new card.",getStarted:"A resident opens portal chat or the mobile app. The banner states they are talking to an assistant. Routine bookings and status checks complete in-session. If the user contests a fact, names a fee, or the retrieval layer has no page, the session transfers to a human agent with the transcript.",paperUrl:"https://portal.gov.example/assistant/notes/grounding-and-handoff.pdf",demoUrl:"https://portal.gov.example/assistant",citationBibtex:`@techreport{bayan-gov-13b-finetune,
  title={bayan-gov-13b-finetune model card},
  author={{Bayan Digital} and Al-Harbi, M.},
  institution={Digital Government Services},
  year={2026},
  month={7},
  url={https://portal.gov.example/assistant/service-card}
}`,glossary:"Handoff: transfer to a human agent with the chat transcript. Grounded answer: a reply that cites a live service-catalogue page. Tool call: a booking or status action the assistant takes without a person. Unreviewable autonomy: a completed action that no officer sees unless the resident complains.",moreInformation:"Public production since 19 January 2026. The open disagreement is on unreviewable autonomy — the engine flags the acts-alone pattern; the service owner’s position is that handoff on contested facts is enough. Next catalogue-and-model review is 19 September 2026. Contact assistant@portal.gov.example.",modelCardAuthors:"Bayan Digital applied-science team (base card) and M. Al-Harbi, Digital Government Services (finetune, retrieval, and this inventory card).",modelCardContact:"assistant@portal.gov.example"}},"sys-5":{card:mi("revenue-anomaly-v4-model-card.md",`Model: revenue-anomaly-v4
Owner: Revenue Compliance (provider and deployer)
Intended use: Rank likely under-reporting so a human auditor can choose what to work. The model does not issue assessments, penalties, or account freezes.

In its first year the queue surfaced an estimated SAR 340 million in unpaid liabilities and cut case selection from six weeks to under three days. Auditors decide every case. The ranking still decides who is scrutinised, so selection bias is the governance question that matters.

Known limits: cash-heavy small businesses and first-time filers are over-represented in the top decile relative to confirmed yield.`),details:{modelType:"Supervised anomaly ranker over tax filings and third-party match keys (employment, banking, and customs). The output is an ordered audit queue plus a one-page evidence summary. No assessment, penalty, or freeze is written by the model.",language:"Arabic filings are the primary input. English appears on some customs and banking match keys.",license:"Internal revenue-authority licence. Features, scores, and the evidence summary do not leave the compliance tenancy.",baseModel:"Not a commercial generative finetune. The ranker is an in-house gradient-boosted model over authority-built features. The evidence summary is a template filled from those features, not a free-text generator.",fundedBy:"Revenue compliance programme. Feature engineering and the 2026 v4 refresh sit on that programme; live scoring is charged to audit operations.",trainingData:"Closed audit files from 2018–2025 joined to employment, banking, and customs match keys. Labels are confirmed under-reporting and confirmed-clear. Informal-economy filers are sparse in the labelled set because those audits are rarer and slower. First-time filers have fewer closed outcomes.",testingData:"Later-year vintages held out from training, plus a challenge set of cash-heavy small businesses and first-time filers assembled by the small-business audit desk.",testingMetrics:"Lift in confirmed under-reporting versus a random audit sample; false-positive rate on small filers; share of top-decile cases that close with no extra liability; time from filing to queue assignment.",resultsSummary:"First-year lift surfaced an estimated SAR 340 million versus the previous manual selection. Small cash-heavy filers are over-represented in the top decile relative to confirmed yield. Time-to-assignment is under three days, down from six weeks. Robustness tests on this system include a failed perturbation check on the evidence record — feature noise moved ranks more than the protocol allows.",biasRisksLimitations:"Auditors decide every case, but they work the queue the model writes. Informal-economy and first-time filers appear more often than their confirmed yield justifies. A business that is never drawn from the bottom of the queue can go years without review. The model must not be wired to assessment, penalty, or freeze systems.",biasRecommendations:"Do not auto-assess, penalise, or freeze an account from this rank. Each quarter, draw a sample from the bottom of the queue so a whole segment cannot hide. Keep the failed robustness finding open until the perturbation protocol is met. The evidence summary is an aid; the auditor’s notes are the decision record.",hardwareType:"CPU training and inference on the authority analytics cluster. No GPU.",hoursUsed:"About 160 CPU-hours for the v4 refresh in March 2026.",cloudProvider:"National government cloud, revenue-authority tenancy.",cloudRegion:"Saudi central zone (sa-central).",co2Emitted:"Estimated 7 kilograms of CO2-equivalent for the v4 refresh. Live daily scoring is not separately metered.",downstreamUse:"Audit queue and evidence summary only. Assessment, penalty, and collections systems take a named auditor’s decision. Do not reuse the rank for licensing, immigration, or banking supervision referrals.",getStarted:"Each night the ranker rebuilds the queue from new filings and match-key refreshes. An auditor is assigned from the top of the queue, reads the evidence summary, and records a decision. Supervisors can pull a bottom-of-queue sample from the quarterly review screen.",paperUrl:"https://revenue.gov.example/analytics/notes/v4-selection-and-lift.pdf",demoUrl:"https://revenue.gov.example/analytics/auditor-sandbox",citationBibtex:`@techreport{revenue-anomaly-v4,
  title={revenue-anomaly-v4 model card},
  author={Al-Otaibi, N.},
  institution={Revenue Compliance},
  year={2026},
  month={7},
  url={https://revenue.gov.example/analytics/model-card}
}`,glossary:"Queue: the ordered list of cases the model proposes for audit. Lift: extra confirmed liability versus a random sample. Bottom-of-queue sample: a quarterly draw from cases the model would not have shown. Confirmed yield: extra liability actually assessed after audit.",moreInformation:"Version 4 in production since 4 April 2026. Hardware, hours, carbon, paper, demo, citation, and glossary were previously blank on this inventory card; this revision fills them from the compliance programme file. Next selection-bias review is 4 October 2026. Contact analytics@revenue.gov.example.",modelCardAuthors:"N. Al-Otaibi, Revenue Compliance, with the small-business audit desk as reviewing author.",modelCardContact:"analytics@revenue.gov.example"}},"sys-6":{card:mi("sentry-txn-9-model-card.md",`Model: sentry-txn-9-finetune
Owner: Fraud and Financial Crime (deployer). Base model: SentryPay Analytics. The bank finetuned on its own history, so provider duties sit here as well.
Intended use: Score retail cards and transfers in real time and block high-risk payments before settlement. A person sees the payment only after the block.

Volume is about 46 million transactions a month. Blocks land in under 150 milliseconds. Since go-live, confirmed fraud losses are down 38 percent and false declines down 24 percent. Analysts can release a block. There is no human gate before it.

Known limits: first-party fraud, merchant-collusion, and new payment corridors (90-day observation window). The live disagreement is whether post-block release counts as human oversight for QCB prior-approval purposes.`),details:{modelType:"Real-time transaction classifier: a gradient-boosted ranker with a rules overlay. The ranker scores card and transfer authorisations; hard rules (velocity, known-bad merchants, sanctioned corridors) can block even when the score is mid-range. The production action is allow, block, or block-and-step-up. A person does not see the payment before a block.",language:"English is the feature language. Arabic appears on some merchant descriptors and remittance narratives; those strings are transliterated, not dropped.",license:"SentryPay customer licence for TXN-9, plus an internal bank licence for the finetune and the rules overlay. Consortium weights do not leave the SentryPay control plane; the bank finetune does not leave the bank.",baseModel:"SentryPay TXN-9, customer release 2025.10, finetuned as sentry-txn-9-finetune on the bank’s own labelled history.",fundedBy:"Financial-crime programme. SentryPay licence, the 2026 finetune, and the 24/7 analyst queue sit on that programme.",trainingData:"SentryPay consortium fraud corpus plus the bank’s own card and transfer history from 2019–2025. Labels are confirmed fraud, confirmed-first-party, analyst release, and customer-disputed decline. New corridors opened after January 2025 are held out of training and used only for the 90-day observation window.",testingData:"Out-of-time months in 2026, a first-party-fraud challenge set from the disputes desk, a merchant-collusion set from financial-crime investigations, and the observation window for two new remittance corridors.",testingMetrics:"Confirmed-fraud catch rate, false-decline rate, time-to-block, release rate within 30 minutes, and corridor-level false-decline versus the 90-day baseline.",resultsSummary:"Blocks complete in under 150 milliseconds on about 46 million transactions a month. Confirmed losses are down 38 percent and false declines down 24 percent versus the pre-go-live ruleset. First-party fraud and merchant-collusion still underperform the catch-rate target. Two new remittance corridors are over-blocked versus their observation-window baseline. A bias-fairness test on corridor is a failed finding on the evidence record.",biasRisksLimitations:"There is no human gate before the block — a false decline is felt immediately, often at a point of sale or a remittance counter. Travel, remittance, and new-merchant corridors are over-blocked. The bank finetuned the vendor model, so provider duties sit with the bank as well as SentryPay. The live disagreement (QA-13.6) is whether an analyst who can only release after the fact counts as human oversight for prior approval of fully autonomous AI.",biasRecommendations:"Every block must remain releasable by a named analyst, 24 hours a day. Do not use this score for creditworthiness, account closure, or law-enforcement referral. Keep new corridors in the 90-day observation window. Do not treat post-block release as if a person had approved the block in advance.",hardwareType:"CPU inference cluster sized for a sub-150-millisecond authorisation SLO. Four GPU-days for the March 2026 finetune only.",hoursUsed:"Forty GPU-hours for the production finetune. Live scoring is CPU-only.",cloudProvider:"Private bank cloud. SentryPay consortium features arrive over a private link; they are not scored in a public region.",cloudRegion:"Doha private zone (qa-doha).",co2Emitted:"Estimated 17 kilograms of CO2-equivalent for the finetune. Live CPU scoring is estimated at 4 kilograms per week; that is a capacity-planning figure, not a meter.",downstreamUse:"Block-and-queue only. Do not feed the score into lending, KYC refresh, marketing, or law-enforcement referral. Releases and confirmed-fraud labels may re-enter training on the next scheduled finetune; that refresh needs a new card version.",getStarted:"An authorisation hits the sentinel inline. High-risk payments are declined to the merchant or the sending rail and land on the analyst queue with a reason code and a release button. Analysts have a 15-minute first-look target on customer-present declines.",paperUrl:"https://sentrypay.example/txn-9/notes/realtime-block-and-release.pdf",demoUrl:"https://bank.qa.example/fraud/analyst-console-demo",citationBibtex:`@techreport{sentry-txn-9-finetune,
  title={sentry-txn-9-finetune model card},
  author={{SentryPay model risk} and Al-Kuwari, H.},
  institution={Fraud and Financial Crime},
  year={2026},
  month={7},
  url={https://sentrypay.example/txn-9/model-card}
}`,glossary:"Release: an analyst reversing a block after the fact. Acts-alone: the block happens before any person sees the payment. Observation window: ninety days of extra monitoring on a new corridor before it leaves the challenge set. Step-up: a block that asks the customer for a second factor rather than a hard decline.",moreInformation:"Production since 11 November 2025. The open disagreement is QA-13.6 (prior approval for fully autonomous AI). Next corridor review is 11 September 2026. Contact fraud-ai@bank.qa.example.",modelCardAuthors:"SentryPay model-risk office (base card) and H. Al-Kuwari, Fraud and Financial Crime (finetune, rules overlay, and this inventory card).",modelCardContact:"fraud-ai@bank.qa.example"}},"sys-7":{card:mi("skylark-rank-4-model-card.md",`Model: skylark-rank-4
Owner: Group Human Resources (deployer). Provider of the hosted service: Skylark Talent.
Intended use: Parse CVs and rank applicants for a requisition. Recruiters review every shortlist before anyone is contacted.

The group receives about 120,000 applications a year, including for roles in EU subsidiaries. Time-to-shortlist has fallen by 60 percent. The ranking still decides who is seen first. Validation found the vendor base model echoed a historical gender skew; that skew is monitored quarterly and has not been closed.

The group bought the service and did not modify weights. Provider duties stay with Skylark. Deployer duties, including EU Annex III employment, sit here. No automated rejection, no video, no emotion analysis, no use for promotion or termination.`),details:{modelType:"Hosted CV parser and ranking service (vendor SaaS). Skylark parses a CV into a structured profile and ranks it against the requisition text. The group does not operate weights or training. Recruiters see an ordered list; they must open it before any candidate is contacted.",language:"English, Arabic, and French CVs are accepted. Role text is usually English. Mixed-language CVs are parsed; they are not dropped.",license:"Skylark Talent customer licence. No in-house weights. The group may not retrain, distill, or export the model. Application data in the group tenant is the group’s; Skylark’s training corpus is not.",baseModel:"Skylark Rank 4, hosted release 2026.03. The group consumes the hosted API only.",fundedBy:"Group HR transformation programme. The Skylark subscription and the quarterly fairness monitor sit on Group Human Resources.",trainingData:"Skylark’s vendor corpus of CVs and hire outcomes. The group does not hold that set and has not been given a datasheet beyond Skylark’s public card. Internal validation used three years of the group’s own applications, including EU-subsidiary roles, scored offline against eventual hire. Those validation labels were not sent back to Skylark.",testingData:"Internal hold-out requisitions from 2025–2026 and a gender-balanced challenge set built by Group HR from anonymised historical applications. Nationality slices were added after the first quarterly monitor.",testingMetrics:"Recall at twenty versus eventual hire; demographic parity gap on gender and nationality; share of page-two candidates who would have been hired; time from requisition to a recruiter-opened shortlist.",resultsSummary:"Time-to-shortlist is down 60 percent. Recall at twenty is inside the agreed band. The vendor base model echoed a historical gender skew: women’s applications ranked lower on the same role text. The quarterly monitor has not closed the gap. A bias-fairness test on this system is a failed finding on the evidence record. The open disagreement is whether EU Annex III employment duties apply to this hosted ranking — the engine says they do.",biasRisksLimitations:"Recruiters review every list, but they start from the model’s order. People who are not on page one are rarely seen. The group bought the service and did not modify weights, so provider duties stay with Skylark — deployer duties, including EU Annex III employment and DIFC notice, sit here. The card must not claim the skew is fixed.",biasRecommendations:"No automated rejection. No video or emotion analysis. Do not use for promotion, compensation, or termination. Until the quarterly gap is inside the agreed band, shuffle a sample of page-two candidates onto each shortlist and record that they were added by the monitor, not by the ranker.",hardwareType:"Vendor-hosted. The group does not operate GPUs or the ranking cluster. Group-side hardware is the applicant-tracking integration only.",hoursUsed:"Not applicable for training — hosted service. Group-side validation scoring used about 12 CPU-hours in the last quarterly monitor.",cloudProvider:"Skylark Talent (vendor). Group tenant data is isolated; it is not used to train Rank 4 unless a future contract says so — the current contract does not.",cloudRegion:"Vendor inference in eu-central-1. Group tenant metadata and the recruiter console are in ae-dubai.",co2Emitted:"Not attributable to the group for training. Skylark’s published card quotes 210 kilograms of CO2-equivalent for Rank 4 training; treat that as vendor-supplied, not independently measured here.",downstreamUse:"Recruiter shortlist only. The applicant-tracking system must not auto-reject, auto-email, or auto-close from this rank. Offer, reject, and interview decisions are recorded by a person.",getStarted:"A recruiter sends a requisition to Skylark. Ranked profiles return to the console. Contact with a candidate happens only after a person opens the list. The quarterly monitor adds a marked page-two sample onto each shortlist until the gender gap is inside the band.",paperUrl:"https://skylarktalent.example/rank/fairness-note",demoUrl:"https://group.example/hr/skylark-recruiter-sandbox",citationBibtex:`@techreport{skylark-rank-4,
  title={skylark-rank-4 deployer model card},
  author={{Skylark Talent} and Fernandes, P.},
  institution={Group Human Resources},
  year={2026},
  month={7},
  url={https://skylarktalent.example/rank/model-card}
}`,glossary:"Recall at twenty: share of eventual hires who appeared in the top twenty ranks. Page-two sample: candidates the monitor inserts from below the first page so they are actually seen. Annex III employment: EU high-risk use for recruitment. Hosted service: the group does not hold or modify the weights.",moreInformation:"Group go-live 22 January 2026. Quarterly fairness monitor dates: April 2026 (gap open) and July 2026 (gap still open). Next monitor 22 October 2026. Contact talent-ai@group.example. For the Annex III disagreement, copy governance@lodestar.demo.",modelCardAuthors:"Skylark Talent (provider card) and P. Fernandes, Group Human Resources (deployer inventory card and the quarterly monitor).",modelCardContact:"talent-ai@group.example — copy governance@lodestar.demo for the Annex III disagreement."}}},Ns=[Lt({id:"sys-1",name:"Procurement Evaluation Agent",entityType:"government",jurisdictions:["AE","AE-DIFC"],affectedParties:["businesses"],purpose:"procurement evaluation",autonomy:"acts-alone",personalData:!0,sensitiveData:!1,provenance:"built",reversible:!1,marketsTargeted:[],financialServices:!1,unknowns:["sensitiveData"],lifecycleStatus:"in_production",owner:"S. Al-Marri",businessUnit:"Government Procurement",vendor:void 0,modelName:"internal-procurement-agent-v3",discoverySource:"declared",deploymentChannel:"agent",deploymentRegions:["AE","AE-DIFC"],businessSectors:["public-sector"],functionalAreas:["supply-chain","legal"],assigneeIds:["user-admin"],description:"An internal agent that shortlists vendors for government tenders worth roughly AED 2.1 billion a year. It reads bid packs, scores suppliers against published criteria, and issues a ranked shortlist that purchasing officers can accept without further review — evaluation cycles that took three weeks now close in four days. A vendor left off a shortlist has no visibility into why, which is what makes the autonomy setting the central governance question.",automatedActivity:"manual vendor sho cations",automationMode:"augments-human-decision",modelCard:_e["sys-2"].card,modelCardDetails:_e["sys-2"].details,functions:["Score consumer credit applications","Flag thin-file and high-risk applicants for manual review","Write a decision rationale for the underwriter"],intendedUsers:"Credit underwriters and the retail origination desk",outOfScopeUses:"Not used for employment, housing, or insurance underwriting",publicUrl:"https://scoreforge.example/sf-credit-7b",documentationUrls:["https://scoreforge.example/sf-credit-7b/model-card","https://bank.example/credit-ai-policy"],operatorRole:"deployer",gpai:!1,annexIIIArea:"essential-services",annexISafetyComponent:!1,interactsWithNaturalPersons:!0,generatesSyntheticContent:!1,emotionOrBiometric:!1,prohibitedPractice:!1}),Lt({id:"sys-3",name:"Benefits Eligibility Screener",entityType:"government",jurisdictions:["SA"],affectedParties:["citizens"],purpose:"benefits eligibility",autonomy:"recommends",personalData:!0,sensitiveData:!0,provenance:"built",reversible:!0,marketsTargeted:[],financialServices:!1,unknowns:[],lifecycleStatus:"in_production",owner:"R. Qassem",businessUnit:"Social Protection",vendor:void 0,modelName:"benefits-screener-v2",discoverySource:"intake",deploymentChannel:"internal",deploymentRegions:["SA"],businessSectors:["public-sector"],functionalAreas:["operations","legal"],assigneeIds:["user-gov"],description:"A caseworking aid that recommends whether a household appears eligible for a social-protection programme covering about 1.2 million beneficiaries. A human caseworker always makes the determination; the model does not issue or withhold payments. Since rollout, average time-to-decision fell from 19 days to 6, and the share of applications returned for missing documents dropped by a third — but a wrong recommendation here touches a family's income, which keeps it squarely in the high-risk category.",automatedActivity:"caseworker eligibility screening against published programme rules",automationMode:
